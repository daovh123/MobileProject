# Render environment variables for SePay top-up flow (example template)
# Do NOT commit real production secrets to git.
#
# Important for BIDV + SePay:
# - Money-in transactions that SePay can match often go to the VA account.
# - Use the receiving account/VA info exactly as shown in SePay "Ngân hàng".

APP_AUTH_TOKEN_SECRET: "replace-with-a-long-random-secret"

SEPAY_API_KEY: "replace-with-your-sepay-api-key"
SEPAY_WEBHOOK_API_KEY: "replace-with-your-sepay-api-key"

# Receiving account shown by SePay (for your linked BIDV account/VA)
SEPAY_ACCOUNT_NUMBER: "replace-with-account-or-va-number-from-sepay"
SEPAY_BANK_CODE: "BIDV"
SEPAY_ACCOUNT_NAME: "replace-with-account-holder-name"
SEPAY_BANK_NAME: "BIDV"

SEPAY_TRANSFER_PREFIX: "YMW"
SEPAY_QR_TEMPLATE: "compact"

MONGODB_URI: "replace-with-your-mongodb-uri"
REDIS_URL: "replace-with-your-redis-url"
