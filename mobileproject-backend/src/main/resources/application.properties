# ── Actuator Health ───────────────────────────────────────────────────────────
# Disable the default MongoDB health indicator (we manage health checks separately).
management.health.mongodb.enabled=false

# ── File Upload (Multipart) ───────────────────────────────────────────────────
# Enable multipart uploads for avatar/file endpoints.
# Max 6 MB per file and per request (5 MB payload + framing overhead).
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# ── Application Identity ─────────────────────────────────────────────────────
spring.application.name=mobileproject-backend

# ── Server Port ───────────────────────────────────────────────────────────────
# Render (and most PaaS) provide a dynamic port via the $PORT env var at runtime.
# Falls back to 8080 for local development.
server.port=${PORT:8080}

# ── Database Connections ──────────────────────────────────────────────────────
# Credentials are injected via environment variables — never hard-code in source control.
spring.mongodb.uri=${MONGODB_URI:}
spring.data.redis.url=${REDIS_URL:}
# Disable Spring Data Redis auto-config repositories (we use RedisTemplate directly).
spring.data.redis.repositories.enabled=false

# ── Place Data Import ─────────────────────────────────────────────────────────
# Controls the one-time bulk import of place data from a JSON file into MongoDB.
# Disabled by default; enable via app.place.import.auto-startup=true.
app.place.import.auto-startup=false
app.place.import.skip-when-data-exists=true
app.place.import.file-path=D:/data.json

# ── Groq / MiniAI Integration ────────────────────────────────────────────────
# Import an optional local secrets.properties file for API keys (not committed).
spring.config.import=optional:file:./secrets.properties
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama3-8b-8192}

# ── Auth Token Configuration ─────────────────────────────────────────────────
# JWT/token secret and TTL for authentication tokens.
# Default TTL: 604800 seconds = 7 days.
app.auth.token-secret=${APP_AUTH_TOKEN_SECRET:}
app.auth.token-ttl-seconds=${APP_AUTH_TOKEN_TTL_SECONDS:604800}

# ── SePay Bank Transfer Top-Up ────────────────────────────────────────────────
# Primary SePay configuration for bank transfer top-ups.
# Account details displayed to users during the top-up flow.
payment.sepay.webhook-api-key=${SEPAY_WEBHOOK_API_KEY:}
payment.sepay.account-number=${SEPAY_ACCOUNT_NUMBER:1234567890}
payment.sepay.account-name=${SEPAY_ACCOUNT_NAME:YOU AND ME WALLET}
payment.sepay.bank-bin=${SEPAY_BANK_BIN:970436}
payment.sepay.bank-name=${SEPAY_BANK_NAME:Vietcombank}
payment.sepay.payment-code-prefix=${SEPAY_PAYMENT_CODE_PREFIX:YAM}

# SePay demo/fallback defaults for local development.
# Set SEPAY_API_KEY in production if the SePay webhook uses API Key authentication.
sepay.api-key=${SEPAY_API_KEY:}
sepay.bank-code=${SEPAY_BANK_CODE:MBBank}
sepay.bank-name=${SEPAY_BANK_NAME:Demo Bank}
sepay.account-number=${SEPAY_ACCOUNT_NUMBER:0123456789}
sepay.account-name=${SEPAY_ACCOUNT_NAME:YOU AND ME WALLET}
sepay.transfer-prefix=${SEPAY_TRANSFER_PREFIX:YMW}
sepay.qr-template=${SEPAY_QR_TEMPLATE:compact}

# ── Firebase (Admin SDK & Storage) ───────────────────────────────────────────
# Path to the Firebase service account credentials JSON file.
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:classpath:firebase-service-account.json}
# Firebase Storage bucket for avatar uploads (e.g. my-app.appspot.com).
firebase.storage.bucket=${FIREBASE_STORAGE_BUCKET:}

# ── Query Monitoring / Logging ────────────────────────────────────────────────
# Enable SQL-equivalent query visibility for MongoDB via Spring Data debug logging.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.org.mongodb.driver.protocol.command=INFO

# ── Redis Cache ───────────────────────────────────────────────────────────────
# Use Redis as the Spring Cache provider; register the "placeById" cache name
# for place-detail lookups (see @Cacheable annotations in PlaceRepository).
spring.cache.type=redis
spring.cache.cache-names=placeById
